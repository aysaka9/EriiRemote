<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Erii 远程</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Custom Frameless Titlebar -->
  <header class="titlebar">
    <div class="titlebar-left">
      <div class="app-logo">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
          <rect x="2.5" y="4" width="19" height="12.5" rx="2.8" stroke="#fff" stroke-width="2.2"/>
          <circle cx="12" cy="10.2" r="2.2" fill="#fff"/>
          <path d="M8 20h8M12 16.5V20" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="app-title">Erii 远程</span>
      <span class="app-tag">开源版</span>
    </div>
    <div class="titlebar-right">
      <button class="local-pill" id="localIpPill" title="点击复制本机虚拟 IP">
        <span class="status-dot connecting" id="engineDot"></span>
        <span id="localIpText">连接局域网中...</span>
      </button>
      <button class="icon-btn" id="btnRefresh" title="立即刷新设备">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"/><path d="M21 3v5h-5"/>
        </svg>
      </button>
      <div class="win-divider"></div>
      <button class="icon-btn" id="btnMin" title="最小化">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg>
      </button>
      <button class="icon-btn" id="btnMax" title="最大化">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
      </button>
      <button class="icon-btn close-btn" id="btnClose" title="最小化到托盘">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </header>

  <div class="app-body">
    <!-- Left Sidebar -->
    <aside class="sidebar">
      <div class="nav-section">
        <div class="nav-header">
          <span class="nav-header-title">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="4" width="14" height="10" rx="2"/><path d="M6 18h6M9 14v4"/>
              <rect x="16" y="9" width="6" height="11" rx="1.5"/>
            </svg>
            我的设备
          </span>
          <span class="online-count" id="onlineCount">0</span>
        </div>
        <div class="device-list" id="sidebarDevices"></div>
        <button class="nav-item" id="navAllDevices">
          <span class="nav-icon grid-icon">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
              <circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/>
              <circle cx="8" cy="16" r="3"/><circle cx="16" cy="16" r="3"/>
            </svg>
          </span>
          <span>全部设备</span>
        </button>
      </div>

      <div class="nav-section">
        <div class="nav-header">
          <span class="nav-header-title">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
            </svg>
            快捷连接
          </span>
        </div>
        <button class="nav-item" id="navDirect">
          <span class="nav-icon blue-soft">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 12h14M13 5l7 7-7 7"/>
            </svg>
          </span>
          <span>IP 直连</span>
        </button>
        <button class="nav-item" id="navFavorites">
          <span class="nav-icon star-soft">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
              <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
            </svg>
          </span>
          <span>收藏设备</span>
        </button>
      </div>

      <div class="sidebar-footer">
        <button class="nav-item" id="navSettings">
          <span class="nav-icon gray-soft">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.85 1 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
          </span>
          <span>设置</span>
        </button>
      </div>
    </aside>

    <!-- Right Main Workspace -->
    <main class="main-panel" id="mainPanel">
      <!-- Dynamic view rendered by renderer.js -->
    </main>
  </div>

  <!-- Modal Container -->
  <div class="modal-mask" id="modalMask">
    <div class="modal-card" id="modalCard"></div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="renderer.js"></script>
</body>
</html>
